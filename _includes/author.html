<section class="author-card" aria-label="About the author">
  <img class="avatar avatar--lg" src="/assets/img/blog-author.jpg" alt="{{ site.username }}" width="72" height="72">
  <div class="author-card__body">
    <p class="author-card__name">{{ site.username }}</p>
    <p class="author-card__desc">{{ site.user_description }}</p>
  </div>
  <a class="btn btn--accent" href="#" data-email="{{ site.email_encoded }}">Get in touch</a>
</section>
