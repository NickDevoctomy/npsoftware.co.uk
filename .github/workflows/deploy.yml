name: Deploy

# Run from the Actions tab ("Run workflow"). It always deploys the head of
# main, tagging it with the next vYYYY.MM.DD[.N] release first.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Ensure main is being deployed
      run: |
        if [[ "$GITHUB_REF" != refs/heads/main ]]; then
          echo "::error::Deploys run from main, not $GITHUB_REF"
          exit 1
        fi

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Work out the release tag
      id: tag
      run: |
        base="v$(date -u +%Y.%m.%d)"
        tag="$base"
        n=0
        while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
          n=$((n + 1))
          tag="$base.$n"
        done
        echo "Releasing $GITHUB_SHA as $tag"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build the site
      run: npm run build
      env:
        SITE_VERSION: ${{ steps.tag.outputs.tag }}

    - name: Create the release
      run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.tag.outputs.tag }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Sync _site to S3
      run: aws s3 sync ./_site "s3://${{ secrets.DESTINATION_BUCKET }}" --delete --acl public-read

    - name: Invalidate CloudFront cache
      run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
